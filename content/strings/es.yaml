locale: es
# Translated from fr.yaml, then read through end to end against it and
# corrected: article contractions, sentence-initial capitals, noun-noun
# compounds that do not work in this language, and phrasing that read as a
# literal rendering rather than as something written in it.
#
# Still awaiting a native speaker, which is what `reviewed` claims -- so it
# stays false and the cover keeps its draft banner. Set it to true once someone
# who speaks this language has read the built PDF.
reviewed: false

meta:
  title: "Manual de uso de Kalulu"
  # One subtitle, naming both readers: nobody has to pick a side before
  # opening the document.
  subtitle: "Para docentes y familias — crear una cuenta, gestionar los estudiantes"

# What the finished PDF is called: one per language, in that language rather
# than in English since it goes to the public -- and ASCII only, without
# spaces or apostrophes, because it travels through download links and mail
# attachments. The locale tag stays: every language is offered from one page.
filenames:
  manual: "Kalulu-Manual-es"

labels:
  contents: "Índice"
  language: "Idioma"
  app_version: "Versión de Kalulu"
  generated: "Documento generado el"
  unreviewed: "BORRADOR — esta traducción aún no ha sido revisada por un hablante nativo."
  # How each reader is named on the page: the chip on a step that is not for
  # everyone, and the callout where the flow forks. Stored lowercase, as the
  # common noun it is -- `{^audience}` capitalises it where a label or a line
  # starts on it, `{audience}` leaves it alone inside a phrase. It has to
  # read as a label ("Docente"), not as a sentence. It is the app's own
  # word for the account type -- "Soy docente" / "Soy progenitor" in
  # ui_strings.csv -- shortened to the noun, so a reader recognises the
  # answer they gave. The cover subtitle is free prose and says "familias".
  audience_teacher: "docente"
  audience_parent: "progenitor"
  audience_only: "Solo {audience}"
  # The fork callout: an opening line, one line per reader, and where they meet
  # again. {steps} is filled from step_one / step_range / step_list, computed
  # from the structure, so the numbers are always the real ones.
  fork_intro: "Aquí el recorrido se separa, según el tipo de cuenta:"
  fork_line: "{^audience}: {steps}"
  fork_rejoin: "Después, todos siguen desde el {steps}."
  step_one: "paso {n}"
  step_range: "pasos {a} a {b}"
  step_list: "pasos {list}"

# The manual's own glossary: a word the document leans on, named once so every
# section names it the same way. `{^adult}` capitalises it to open a sentence.
vocabulary:
  adult: "el adulto"

sections:
  getting-started:
    title: "Primeros pasos"
    intro: >-
      Kalulu enseña a leer con el método de decodificación. Este manual cubre
      todo lo que ocurre antes del juego: crear la cuenta, iniciar sesión y
      gestionar los estudiantes.
    steps:
      who-this-is-for:
        title: "Un solo manual, para docentes y familias"
        body: >-
          Kalulu se usa en el aula igual que en casa, y casi todo funciona de la
          misma manera. Por eso este manual sirve para los dos casos: léalo de
          principio a fin, sin tener que elegir entre dos documentos.
        note: >-
          Los pocos pasos que son para un solo lector llevan una etiqueta,
          «Solo docente» o «Solo progenitor»: sáltese los que no le corresponden.
          Y donde el recorrido se separa de verdad, un cuadro indica qué pasos
          seguir y desde qué paso siguen todos juntos.
      welcome:
        title: "La pantalla de inicio"
        body: >-
          Al abrir la aplicación, Kalulu muestra la pantalla de inicio. Es el
          punto de partida tanto para entrar en una cuenta existente como para
          crear una nueva.
      two-kinds-of-login:
        title: "Dos accesos que no hay que confundir"
        body: >-
          Kalulu distingue el acceso <b>de adulto</b> del acceso
          <b>de estudiante</b>. {^adult} entra con un correo electrónico y una
          contraseña, para gestionar la cuenta. El estudiante entra con un
          código de tres símbolos, sin teclado ni contraseña.
        note: >-
          Los ajustes de la cuenta son solo para adultos. Kalulu pide una
          pequeña comprobación antes de dar acceso.

  create-account:
    title: "Crear una cuenta"
    intro: >-
      La cuenta se crea una sola vez, en unas pocas pantallas. Después podrá
      cambiarlo todo en {ui:SETTINGS}.
    steps:
      open-signup:
        title: "Abrir la creación de cuenta"
        body: >-
          En la pantalla de inicio, elija la pestaña {ui:CREATE_ACCOUNT}.
      language:
        title: "Elegir el idioma"
        body: >-
          Seleccione el idioma en el que los estudiantes van a aprender a leer y
          pulse {ui:NEXT}.
        note: >-
          Es el idioma del contenido pedagógico y determina las lecciones que se
          descargan. Es independiente del idioma de la interfaz.
      account-type:
        title: "Indicar el tipo de cuenta"
        body: >-
          Elija «{ui:TEACHER}» si los estudiantes usan Kalulu en el aula, o
          «{ui:PARENT}» si se trata de sus hijos en casa. Esta elección solo
          cambia las pantallas de creación que siguen: no restringe nada
          después, y se puede modificar en {ui:SETTINGS}.
      method:
        title: "Elegir el método educativo"
        body: >-
          Indique si usa únicamente la aplicación o si la acompaña con los
          cuadernos y los juegos en papel.
      devices:
        title: "Indicar el número de dispositivos"
        body: >-
          Indique en cuántos dispositivos trabajarán los estudiantes. Kalulu los distribuirá entre los dispositivos.
      students-count:
        title: "Indicar el número de estudiantes por dispositivo"
        body: >-
          Para cada dispositivo, indique cuántos estudiantes lo usarán. Kalulu los
          crea y les asigna automáticamente un código de acceso.
        note: >-
          En este paso los estudiantes se crean sin nombre. Los renombrará
          después en {ui:SETTINGS} — véase «Cambiar el nombre de un estudiante».
      player:
        title: "Rellenar los datos de cada estudiante"
        body: >-
          Escriba el nombre y la edad de cada estudiante. Aquí es donde elige los
          identificadores que aparecerán en la aplicación.
        note: >-
          Si se equivoca, o más adelante si hace falta, estos datos siguen
          siendo modificables — véase «Cambiar el nombre de un estudiante».
      credentials:
        title: "Escribir sus credenciales"
        body: >-
          Introduzca su correo electrónico y elija una contraseña. Son sus
          credenciales de adulto: sirven para recuperar la cuenta en otro
          dispositivo y para acceder a los ajustes.
      conditions:
        title: "Aceptar las condiciones generales"
        body: >-
          Lea las condiciones generales de uso y marque la casilla para
          aceptarlas.
      recap:
        title: "Comprobar el resumen"
        body: >-
          La última pantalla resume la cuenta: correo electrónico, tipo de
          cuenta, número de dispositivos y los estudiantes con su código.
          Compruébelo y confirme.
        note: >-
          Hay que pulsar «{ui:SAVE_ALL_CODES}» para que «{ui:VALIDATE}» se
          active: es el único momento en que se ofrece la hoja de códigos.
          Basta con pulsarlo: aunque cierre la ventana de guardado sin guardar
          nada, «{ui:VALIDATE}» queda disponible. Guárdela de todos modos: son
          los códigos con los que entran los estudiantes. Ojo: si vuelve atrás
          para cambiar un nombre o el número de estudiantes, la hoja ya no
          describe la cuenta, así que hay que pedirla otra vez y
          «{ui:VALIDATE}» se desactiva hasta entonces.
      created:
        title: "La cuenta ya está creada"
        body: >-
          Kalulu confirma la creación de la cuenta.
          {ui:CODES_AVAILABLE_IN_SETTINGS}

  sign-in:
    title: "Entrar en su cuenta"
    intro: >-
      El acceso de adulto sirve para recuperar la cuenta, en este dispositivo o
      en otro.
    steps:
      adult-sign-in:
        title: "Introducir sus credenciales"
        body: >-
          En la pantalla de inicio, quédese en la pestaña de acceso, escriba su
          correo electrónico y su contraseña y pulse {ui:NEXT}.
        note: >-
          El botón «{ui:RESET_PASSWORD}» no está ahí de entrada: solo aparece
          después de un intento de acceso rechazado por la contraseña, bajo el
          mensaje «{ui:LOGIN_WRONG_PASSWORD}». Púlselo y Kalulu envía un enlace
          a la dirección introducida, y luego muestra
          «{ui:CHECK_YOUR_EMAIL}»; el botón queda desactivado después, ya que
          solo se envía un mensaje. Si el mensaje es
          «{ui:LOGIN_USER_NOT_FOUND}», el botón no aparecerá: lo que hay que
          corregir es la dirección.
      pick-device:
        title: "Elegir el dispositivo"
        body: >-
          Si su cuenta abarca varios dispositivos, Kalulu pregunta en cuál está.
          Cada dispositivo tiene sus propios estudiantes.

  student-sign-in:
    title: "Acceso del estudiante"
    intro: >-
      El estudiante no tiene correo ni contraseña: entra con un código de tres
      símbolos que puede reconocer sin saber leer.
    steps:
      code-screen:
        title: "La pantalla de acceso"
        body: >-
          Una vez elegido el dispositivo, Kalulu muestra el teclado de símbolos.
          Arriba se indica de qué dispositivo se trata.
      enter-code:
        title: "Introducir el código"
        body: >-
          El estudiante pulsa sus tres símbolos, en orden. Las casillas de
          arriba se van rellenando. El juego arranca en cuanto el código está
          completo.
      forgot-code:
        title: "Código olvidado"
        body: >-
          Los códigos de los estudiantes se pueden consultar en cualquier momento en
          {ui:SETTINGS}, en la línea «{ui:STUDENT_CODES}».

  how-to-play:
    title: "Cómo se juega"
    intro: >-
      Kalulu se presenta como un viaje: doce jardines encadenados, una lección
      tras otra. Esta parte describe lo que el estudiante ve y hace. Aquí no hay
      nada que configurar.
    steps:
      gardens-chain:
        title: "Doce jardines, una sola cadena"
        body: >-
          Todo el recorrido cabe en doce jardines, enlazados en un orden fijo.
          Siempre se avanza en el mismo sentido: un jardín se abre cuando el
          anterior está terminado, y no se salta ninguno.
      one-garden:
        title: "Dentro de un jardín"
        body: >-
          Un jardín contiene unas cuantas lecciones, puestas como fichas a lo
          largo de un camino. La ficha rodeada de dorado es la siguiente que
          toca jugar; las grises siguen cerradas. El camino sale del jardín y
          continúa hacia el siguiente.
        note: >-
          El jardín florece poco a poco: las plantas y los animales aparecen a
          medida que el estudiante termina sus lecciones.
      what-is-a-lesson:
        title: "Qué es una lección"
        body: >-
          Al pulsar una ficha, la lección se abre en rueda. En el centro, la
          película «{ui:LOOKANDLEARN}»; alrededor, los minijuegos de la lección,
          uno por sector. El borde dorado señala lo que viene a continuación.
      look-and-learn:
        title: "La película «{ui:LOOKANDLEARN}»"
        body: >-
          Cada lección empieza con una película corta que presenta el grafema:
          cómo se escribe y qué sonido hace. Se puede repetir tantas veces como
          se quiera.
      minigames:
        title: "Los minijuegos"
        body: >-
          Después vienen de uno a tres minijuegos, según la lección. Cada uno es
          un juego de animales — medusas, ranas, cangrejos, monos, cotorras,
          pingüinos, tortugas, hormigas, orugas — y se abren uno tras otro. La
          lección termina cuando se superan todos.
      boss:
        title: "Los jefes"
        body: >-
          Entre dos jardines espera un jefe: palabras que hay que leer, sin
          imagen ni pista. Hay que superarlo para entrar en el jardín siguiente.
      boss-blocks:
        title: "Cuando el jefe se resiste"
        body: >-
          Tras dos fallos seguidos, el jefe se bloquea y el juego pide la intervención de un adulto. La pantalla pide repetir el jefe con el estudiante y hacerle
          pronunciar las palabras en voz alta, y luego introducir los tres
          símbolos que muestra para desbloquear la aplicación.
        note: >-
          No es un castigo, es una señal: la lectura todavía no está afianzada,
          y es el momento de rehacer ese paso con el estudiante.
      brain-screen:
        title: "La pantalla del cerebro"
        body: >-
          El cerebro muestra el viaje entero: los doce jardines de un vistazo,
          los jefes que los separan y el progreso del jugador. Ahí se ve el camino
          recorrido y lo que queda.
      final-boss:
        title: "El último jefe"
        body: >-
          Al final del último jardín espera un jefe final. Vencerlo desbloquea
          algo en la pantalla del cerebro: no lo describimos aquí, es una sorpresa para descubrir junto al estudiante.
  manage-students:
    title: "Acceder a los ajustes"
    intro: >-
      Todo lo relativo a los estudiantes — añadir, renombrar, eliminar — ocurre en
      los ajustes, reservados a los adultos.
    steps:
      open-settings:
        title: "Abrir los ajustes"
        body: >-
          Desde la pantalla de acceso del estudiante, pulse {ui:SETTINGS}.
      adult-check:
        title: "Demostrar que es un adulto"
        body: >-
          Kalulu muestra una pequeña comprobación para asegurarse de que
          un estudiante no entra solo en los ajustes. Siga la instrucción que
          aparece.
      student-list:
        title: "La lista de estudiantes"
        body: >-
          Los ajustes muestran los estudiantes del dispositivo seleccionado, cada uno
          con su código. Las pastillas de arriba permiten pasar de un
          dispositivo a otro.

  add-student:
    title: "Añadir un estudiante"
    steps:
      add-button:
        title: "Pulsar el botón de añadir"
        body: >-
          En los ajustes, pulse el icono de añadir señalado abajo. Los botones
          de esta fila no llevan texto: su nombre aparece como información
          emergente.
      confirm-add:
        title: "Confirmar"
        body: >-
          Kalulu pide confirmación: «{ui:ADD_STUDENT_POPUP}». El estudiante se
          crea con un código nuevo, y podrá renombrarlo enseguida.
      internet-needed:
        title: "Hace falta conexión a internet"
        body: >-
          {ui:SETTINGS_INTERNET_MANDATORY_TO_ADD_STUDENT}. Es el servidor el que
          garantiza que el código asignado no esté ya ocupado. Sin conexión, el
          botón de añadir no aparece.

  rename-student:
    title: "Cambiar el nombre de un estudiante"
    intro: >-
      El nombre de un estudiante se puede cambiar en cualquier momento, sin
      consecuencias para su progreso ni para su código.
    steps:
      pick-student:
        title: "Elegir el estudiante"
        body: >-
          En la lista, pulse sobre el estudiante al que quiere cambiar el
          nombre.
      edit-name:
        title: "Modificar el nombre"
        body: >-
          Se abre la ficha del estudiante. Pulse sobre el nombre para
          editarlo y confirme.
      close-panel:
        title: "Cerrar la ficha"
        body: >-
          Cierre la ventana con la cruz de arriba a la derecha. El nombre nuevo
          aparece de inmediato en la lista.

  delete-student:
    title: "Eliminar un estudiante"
    intro: >-
      Eliminar quita al estudiante de la cuenta y libera su código.
    steps:
      open-panel:
        title: "Abrir la ficha y pulsar la papelera"
        body: >-
          Abra la ficha del estudiante y pulse el icono de la papelera.
      confirm-delete:
        title: "Confirmar la eliminación"
        body: >-
          Kalulu pide confirmación: «{ui:DELETE_STUDENT_POPUP}»
      irreversible:
        title: "Es definitivo"
        body: >-
          El progreso del estudiante se pierde y no se puede recuperar, ni
          siquiera desde el servidor. En caso de duda, cambie el nombre de la
          ficha y reutilícela.

  synchronise:
    title: "Sincronización y hoja de códigos"
    steps:
      why:
        title: "Para qué sirve la sincronización"
        body: >-
          Kalulu funciona sin conexión y envía los datos al servidor en cuanto
          hay internet. La sincronización manual sirve para forzar ese envío,
          por ejemplo justo después de cambiar el nombre de un estudiante.
        note: >-
          No es obligatorio: la actualización se envía de todos modos la próxima
          vez que entre el estudiante.
      sync-button:
        title: "Sincronizar ahora"
        body: >-
          En los ajustes, pulse el icono de sincronización, cuya información
          emergente indica «{ui:SYNCHRONIZE_ACCOUNT}».
      codes-sheet:
        title: "Recuperar los códigos"
        body: >-
          El icono de exportación, cuya información emergente indica
          «{ui:EXPORT_STUDENT_CODES}», vuelve a guardar la hoja de códigos en
          cualquier momento. Útil para reimprimirla, o después de añadir
          un estudiante.
  troubleshooting:
    title: "Si algo no funciona"
    intro: >-
      Si no encuentra a continuación la respuesta a su pregunta, escríbanos a
      <a href="https://excellolab.org/contact/"><font color="#812a80">https://excellolab.org/contact/</font></a>
      o directamente por correo a <a href="mailto:contact@excellolab.org"><font color="#812a80">contact@excellolab.org</font></a>.
    steps:
      forgot-password:
        title: "Contraseña olvidada"
        body: >-
          El botón «{ui:RESET_PASSWORD}» no aparece de entrada: solo se
          muestra después de un intento de inicio de sesión rechazado por la
          contraseña, debajo del mensaje «{ui:LOGIN_WRONG_PASSWORD}».
          Escriba entonces su correo electrónico con cualquier contraseña y
          pulse {ui:NEXT}: el botón aparece, y al pulsarlo se envía un
          enlace de restablecimiento a la dirección indicada.
        note: >-
          Kalulu muestra después «{ui:CHECK_YOUR_EMAIL}» y el botón queda
          inactivo: solo se envía un mensaje. Si el mensaje que aparece es
          «{ui:LOGIN_USER_NOT_FOUND}», el botón no se mostrará — lo que hay
          que corregir es el correo electrónico, no la contraseña.
      cannot-connect:
        title: "Kalulu no consigue contactar con su servidor"
        body: >-
          El dispositivo está conectado a Internet, pero Kalulu avisa de que
          su servidor no responde. Es la red la que bloquea — cortafuegos o
          proxy — y es frecuente en un centro educativo. Hay dos soluciones:
          pedir que se autorice Kalulu en esa red, o hacer la operación una
          vez desde otra red. Basta con compartir la conexión del móvil, y una
          vez creada la cuenta la aplicación funciona sin conexión.
        note: >-
          Los dos dominios que debe autorizar el servicio informático,
          copiados tal cual: <b>api.kalulu.org</b>, que sirve para iniciar
          sesión y sincronizar, y
          <b>kalulu-app-language-packs.s3.eu-west-3.amazonaws.com</b>, de
          donde vienen los paquetes de idioma.
      proxy:
        title: "La red pasa por un proxy"
        body: >-
          Muchas redes de centros educativos hacen pasar todo el acceso a
          Internet por un servidor intermedio llamado proxy. Los navegadores
          están configurados para usarlo, pero Kalulu no lee ese ajuste por sí
          solo y no obtiene ninguna respuesta. Cuando el fallo tiene esa
          forma, la pantalla ofrece debajo del mensaje la opción
          «{ui:USE_PROXY}»: márquela, pulse {ui:PROXY_APPLY} y vuelva a
          intentarlo.
        note: >-
          Si el dispositivo ya declara un proxy, la dirección viene rellenada
          y basta con marcar la casilla; si no, el servicio informático la
          facilita, con el formato <b>servidor:puerto</b>. La opción solo
          aparece debajo de un mensaje que un proxy podría explicar, nunca
          debajo de una contraseña rechazada — y en una red normal no hay que
          marcarla: impediría que Kalulu se conectara.
      network-other:
        title: "Otras tres causas de conexión imposible"
        body: >-
          Kalulu reconoce otras tres situaciones y las escribe en la pantalla.
          «{ui:DNS_FILTERED_TITLE}»: un filtrado DNS — control parental,
          filtrado del centro, router del operador — desvía api.kalulu.org, y
          hay que pedir que se desbloquee ese dominio.
          «{ui:TLS_INTERCEPTED_TITLE}»: un antivirus o un control parental
          instalado en el dispositivo inspecciona las conexiones seguras;
          añada en él una excepción para api.kalulu.org.
          «{ui:CLOCK_SKEW_TITLE}»: corrija la fecha y la hora en los ajustes
          del dispositivo, sin ellas no es posible ninguna conexión segura.
      student-code-lost:
        title: "Un estudiante ha olvidado su código"
        body: >-
          Los códigos se pueden consultar en cualquier momento en
          {ui:SETTINGS}, en la línea «{ui:STUDENT_CODES}», y la hoja
          imprimible se puede volver a guardar desde la misma pantalla — véase
          «Sincronización y hoja de códigos».
      desktop-wont-start:
        title: "La aplicación no arranca en el ordenador"
        body: >-
          Tanto en Windows como en macOS, el sistema bloquea por defecto una
          aplicación descargada fuera de su tienda. No es una avería de
          Kalulu, y los pasos a seguir son unos pocos clics: están descritos
          en <b>Kalulu-Installation-Help.pdf</b>, adjunto a cada versión en la página de
          descargas.
        note: >-
          La página de descargas de Kalulu:
          <a href="https://github.com/Excello-Recherche-Education/Kalulu-Frontend/releases"><font color="#812a80">https://github.com/Excello-Recherche-Education/Kalulu-Frontend/releases</font></a>
