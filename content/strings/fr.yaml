locale: fr
# Authored in French, reviewed. The other languages are translated from this one.
reviewed: true

meta:
  title: "Manuel d'utilisation de Kalulu"
  subtitle_teacher: "Guide de l'enseignant — créer un compte, gérer les étudiants"
  subtitle_parent: "Guide du parent — créer un compte, gérer les étudiants"

labels:
  contents: "Sommaire"
  language: "Langue"
  app_version: "Version de Kalulu"
  generated: "Document généré le"
  unreviewed: "BROUILLON — cette traduction n'a pas encore été relue par un locuteur natif."

vocabulary:
  teacher:
    adult: "l'enseignant"
    you_are: "enseignant"
  parent:
    adult: "le parent"
    you_are: "parent"

sections:
  getting-started:
    title: "Prise en main"
    intro: >-
      Kalulu enseigne la lecture par la méthode du décodage. Ce manuel
      couvre tout ce qui se passe avant le jeu lui-même : créer le compte,
      s'y connecter, et gérer les étudiants.
    steps:
      welcome:
        title: "L'écran d'accueil"
        body: >-
          À l'ouverture de l'application, Kalulu affiche l'écran d'accueil.
          C'est le point de départ pour se connecter à un compte existant
          comme pour en créer un nouveau.
      two-kinds-of-login:
        title: "Deux connexions à ne pas confondre"
        body: >-
          Kalulu distingue la connexion <b>adulte</b> et la connexion
          <b>étudiant</b>. {^adult} se connecte avec une adresse mail et un mot
          de passe, pour gérer le compte. L'étudiant, lui, se connecte avec
          un code de trois symboles, sans clavier ni mot de passe.
        note: >-
          Les paramètres du compte sont réservés aux adultes. Kalulu demande une
          petite vérification avant d'y donner accès.

  create-account:
    title: "Créer un compte"
    intro: >-
      La création de compte se fait une seule fois, en quelques écrans. Vous
      pourrez tout modifier ensuite dans {ui:SETTINGS}.
    steps:
      open-signup:
        title: "Ouvrir la création de compte"
        body: >-
          Sur l'écran d'accueil, choisissez l'onglet {ui:CREATE_ACCOUNT}.
      language:
        title: "Choisir la langue"
        body: >-
          Sélectionnez la langue dans laquelle les étudiants vont apprendre à lire,
          puis appuyez sur {ui:NEXT}.
        note: >-
          C'est la langue du contenu pédagogique, et elle détermine les leçons
          téléchargées. Elle est indépendante de la langue de l'interface.
      account-type:
        title: "Indiquer le type de compte"
        body: >-
          Choisissez « {ui:TEACHER} » ou « {ui:PARENT} ». Vous êtes
          {you_are} : les questions suivantes en dépendent.
      method:
        title: "Choisir la méthode d'éducation"
        body: >-
          Indiquez si vous utilisez uniquement l'application, ou si vous
          l'accompagnez des livrets et des jeux en papier.
      devices:
        title: "Indiquer le nombre d'appareils"
        body: >-
          Précisez sur combien d'appareils les étudiants travailleront. Kalulu les répartira entre les appareils.
      students-count:
        title: "Indiquer le nombre d'étudiants par appareil"
        body: >-
          Pour chaque appareil, indiquez combien d'étudiants l'utiliseront. Kalulu
          les crée et leur attribue automatiquement un code d'accès.
        note: >-
          Les étudiants sont créés sans nom à cette étape. Vous les renommerez
          ensuite dans {ui:SETTINGS} — voir « Renommer un étudiant ».
      player:
        title: "Renseigner chaque étudiant"
        body: >-
          Saisissez le prénom et l'âge de chaque étudiant. C'est ici que vous
          choisissez les identifiants qui s'afficheront dans l'application.
        note: >-
          En cas d'erreur, ou plus tard si besoin, ces informations restent
          modifiables — voir « Renommer un étudiant ».
      credentials:
        title: "Saisir vos identifiants"
        body: >-
          Entrez votre adresse mail et choisissez un mot de passe. Ce sont vos
          identifiants d'adulte : ils servent à retrouver le compte sur un autre
          appareil et à accéder aux paramètres.
      conditions:
        title: "Accepter les conditions générales"
        body: >-
          Lisez les conditions générales d'utilisation et cochez la case pour
          les accepter.
      recap:
        title: "Vérifier le récapitulatif"
        body: >-
          Le dernier écran résume le compte : adresse mail, type de compte,
          nombre d'appareils et les étudiants avec leur code. Vérifiez, puis
          confirmez.
        note: >-
          Le bouton « {ui:SAVE_ALL_CODES} » enregistre la fiche des codes dans
          un fichier. Gardez-la : c'est avec ces codes que les étudiants se
          connectent.
      created:
        title: "Le compte est créé"
        body: >-
          Kalulu confirme la création du compte. {ui:CODES_AVAILABLE_IN_SETTINGS}

  sign-in:
    title: "Se connecter à son compte"
    intro: >-
      La connexion adulte sert à retrouver son compte, sur cet appareil ou sur un autre.
    steps:
      adult-sign-in:
        title: "Entrer ses identifiants"
        body: >-
          Sur l'écran d'accueil, restez sur l'onglet de connexion, saisissez
          votre adresse mail et votre mot de passe, puis appuyez sur
          {ui:NEXT}.
        note: >-
          Mot de passe oublié ? Utilisez « {ui:RESET_PASSWORD} » : Kalulu envoie
          un lien à votre adresse mail.
      pick-device:
        title: "Choisir l'appareil"
        body: >-
          Si votre compte couvre plusieurs appareils, Kalulu vous demande sur lequel vous êtes. Chaque appareil a ses propres étudiants.

  student-sign-in:
    title: "Connexion de l'étudiant"
    intro: >-
      L'étudiant n'a ni adresse mail ni mot de passe : il se connecte avec un
      code de trois symboles, qu'il peut reconnaître sans savoir lire.
    steps:
      code-screen:
        title: "L'écran de connexion"
        body: >-
          Une fois l'appareil choisi, Kalulu affiche le clavier de symboles.
          L'écran indique en haut de quel appareil il s'agit.
      enter-code:
        title: "Saisir le code"
        body: >-
          L'étudiant appuie sur ses trois symboles, dans l'ordre. Les cases
          en haut se remplissent au fur et à mesure. Le jeu démarre dès que le
          code est complet.
      forgot-code:
        title: "Code oublié"
        body: >-
          Les codes des étudiants sont consultables à tout moment dans
          {ui:SETTINGS}, à la ligne « {ui:STUDENT_CODES} ».

  how-to-play:
    title: "Comment on joue"
    intro: >-
      Kalulu se présente comme un voyage : douze jardins mis bout à bout, une
      leçon après l'autre. Cette partie décrit ce que l'étudiant voit et
      fait. Il n'y a rien à régler ici.
    steps:
      gardens-chain:
        title: "Douze jardins, une seule chaîne"
        body: >-
          Le parcours entier tient en douze jardins, reliés dans un ordre fixe.
          On avance toujours dans le même sens : un jardin s'ouvre quand le
          précédent est fini, et rien ne se saute.
      one-garden:
        title: "À l'intérieur d'un jardin"
        body: >-
          Un jardin contient quelques leçons, posées comme des pastilles le long
          d'un chemin. La pastille entourée d'or est la prochaine à jouer, les
          grises sont encore fermées. Le chemin ressort du jardin et continue
          vers le suivant.
        note: >-
          Le jardin fleurit au fur et à mesure : plantes et animaux apparaissent
          à mesure que l'étudiant termine ses leçons.
      what-is-a-lesson:
        title: "Ce qu'est une leçon"
        body: >-
          Quand on appuie sur une pastille, la leçon s'ouvre en roue. Au centre, le
          film « {ui:LOOKANDLEARN} » ; tout autour, les mini-jeux de la leçon,
          un par quartier. Le contour doré indique ce qui vient ensuite.
      look-and-learn:
        title: "Le film « {ui:LOOKANDLEARN} »"
        body: >-
          Chaque leçon commence par un court film qui présente le graphème :
          comment il s'écrit, et le son qu'il fait. Il se rejoue autant de fois
          qu'on veut.
      minigames:
        title: "Les mini-jeux"
        body: >-
          Viennent ensuite un à trois mini-jeux, selon la leçon. Chacun est un
          jeu d'animal — méduses, grenouilles, crabes, singes, perruches,
          manchots, tortues, fourmis, chenilles — et ils s'ouvrent l'un après
          l'autre. La leçon est terminée quand tous sont réussis.
      boss:
        title: "Les boss"
        body: >-
          Entre deux jardins se tient un boss : des mots à lire, sans image ni
          indice. Il faut le passer pour entrer dans le jardin suivant.
      boss-blocks:
        title: "Quand le boss résiste"
        body: >-
          Après deux échecs de suite, le boss se bloque et le jeu réclame un
          adulte. L'écran demande de refaire le boss avec l'étudiant et de
          lui faire prononcer les mots à voix haute, puis d'entrer les trois
          symboles qu'il affiche pour débloquer l'application.
        note: >-
          Ce n'est pas une punition, c'est un signal : la lecture n'est pas
          encore acquise, et c'est le moment de refaire le passage avec
          l'étudiant.
      brain-screen:
        title: "L'écran du cerveau"
        body: >-
          Le cerveau montre le voyage en entier : les douze jardins d'un coup
          d'œil, les boss qui les séparent, et la progression du joueur. C'est là qu'on
          voit le chemin parcouru et ce qui reste.
      final-boss:
        title: "Le dernier boss"
        body: >-
          Au bout du dernier jardin attend un boss final. Le battre débloque
          quelque chose sur l'écran du cerveau : nous ne le décrivons pas ici,
          c'est une surprise à découvrir avec l'étudiant.
  manage-students:
    title: "Accéder aux paramètres"
    intro: >-
      Tout ce qui concerne les étudiants — ajouter, renommer, supprimer — se passe
      dans les paramètres, réservés aux adultes.
    steps:
      open-settings:
        title: "Ouvrir les paramètres"
        body: >-
          Depuis l'écran de connexion étudiant, appuyez sur {ui:SETTINGS}.
      adult-check:
        title: "Prouver que vous êtes un adulte"
        body: >-
          Kalulu affiche une petite vérification pour s'assurer qu'un étudiant
          n'entre pas seul dans les paramètres. Suivez l'instruction affichée.
      student-list:
        title: "La liste des étudiants"
        body: >-
          Les paramètres affichent les étudiants de l'appareil sélectionné, chacun
          avec son code. Les pastilles du haut permettent de passer d'un
          appareil à l'autre.

  add-student:
    title: "Ajouter un étudiant"
    steps:
      add-button:
        title: "Appuyer sur le bouton d'ajout"
        body: >-
          Dans les paramètres, appuyez sur l'icône d'ajout entourée ci-dessous.
          Les boutons de cette rangée n'ont pas de libellé écrit : leur nom
          apparaît en info-bulle.
      confirm-add:
        title: "Confirmer"
        body: >-
          Kalulu demande confirmation : « {ui:ADD_STUDENT_POPUP} ». L'étudiant
          est créé avec un nouveau code, que vous pourrez renommer aussitôt.
      internet-needed:
        title: "Une connexion internet est nécessaire"
        body: >-
          {ui:SETTINGS_INTERNET_MANDATORY_TO_ADD_STUDENT}. C'est le serveur qui
          garantit que le code attribué n'est pas déjà pris. Hors connexion, le
          bouton d'ajout n'apparaît pas.

  rename-student:
    title: "Renommer un étudiant"
    intro: >-
      Le nom d'un étudiant peut être modifié à tout moment, sans conséquence sur
      sa progression ni sur son code.
    steps:
      pick-student:
        title: "Choisir l'étudiant"
        body: >-
          Dans la liste, appuyez sur l'étudiant que vous voulez renommer.
      edit-name:
        title: "Modifier le nom"
        body: >-
          La fiche de l'étudiant s'ouvre. Appuyez sur le nom pour l'éditer,
          puis validez.
      close-panel:
        title: "Fermer la fiche"
        body: >-
          Fermez la fenêtre avec la croix en haut à droite. Le nouveau nom
          apparaît immédiatement dans la liste.

  delete-student:
    title: "Supprimer un étudiant"
    intro: >-
      La suppression retire l'étudiant du compte et libère son code.
    steps:
      open-panel:
        title: "Ouvrir la fiche et appuyer sur la corbeille"
        body: >-
          Ouvrez la fiche de l'étudiant, puis appuyez sur l'icône de
          corbeille.
      confirm-delete:
        title: "Confirmer la suppression"
        body: >-
          Kalulu demande confirmation : « {ui:DELETE_STUDENT_POPUP} »
      irreversible:
        title: "C'est définitif"
        body: >-
          La progression de l'étudiant est perdue et n'est pas récupérable,
          y compris depuis le serveur. En cas de doute, renommez plutôt la fiche
          et réutilisez-la.

  synchronise:
    title: "Synchronisation et fiche des codes"
    steps:
      why:
        title: "À quoi sert la synchronisation"
        body: >-
          Kalulu fonctionne hors connexion et envoie les données au serveur dès
          qu'internet est disponible. La synchronisation manuelle sert à forcer
          cet envoi, par exemple juste après avoir renommé un étudiant.
        note: >-
          Ce n'est pas obligatoire : la mise à jour part de toute façon à la
          prochaine connexion de l'étudiant.
      sync-button:
        title: "Synchroniser maintenant"
        body: >-
          Dans les paramètres, appuyez sur l'icône de synchronisation, dont
          l'info-bulle indique « {ui:SYNCHRONIZE_ACCOUNT} ».
      codes-sheet:
        title: "Retrouver les codes"
        body: >-
          L'icône d'export, dont l'info-bulle indique
          « {ui:EXPORT_STUDENT_CODES} », réenregistre la fiche des codes à tout
          moment. Utile pour la réimprimer, ou après avoir ajouté un étudiant.
