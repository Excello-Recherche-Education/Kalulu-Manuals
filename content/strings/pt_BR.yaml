locale: pt_BR
# Translated from fr.yaml, then read through end to end against it and
# corrected: article contractions, sentence-initial capitals, noun-noun
# compounds that do not work in this language, and phrasing that read as a
# literal rendering rather than as something written in it.
#
# Still awaiting a native speaker, which is what `reviewed` claims -- so it
# stays false and the cover keeps its draft banner. Set it to true once someone
# who speaks this language has read the built PDF.
reviewed: false

meta:
  title: "Manual de uso do Kalulu"
  subtitle_teacher: "Guia do professor — criar uma conta, gerenciar os estudantes"
  subtitle_parent: "Guia da família — criar uma conta, gerenciar os estudantes"

labels:
  contents: "Sumário"
  language: "Idioma"
  app_version: "Versão do Kalulu"
  generated: "Documento gerado em"
  unreviewed: "RASCUNHO — esta tradução ainda não foi revisada por um falante nativo."

vocabulary:
  teacher:
    adult: "o professor"
    you_are: "professor"
  parent:
    adult: "a família"
    you_are: "mãe, pai ou responsável"

sections:
  getting-started:
    title: "Primeiros passos"
    intro: >-
      O Kalulu ensina a ler pelo método da decodificação. Este manual cobre tudo
      o que acontece antes do jogo: criar a conta, entrar nela e gerenciar
      os estudantes.
    steps:
      welcome:
        title: "A tela inicial"
        body: >-
          Ao abrir o aplicativo, o Kalulu mostra a tela inicial. É o ponto de
          partida tanto para entrar em uma conta existente quanto para criar uma
          nova.
      two-kinds-of-login:
        title: "Dois acessos que não se devem confundir"
        body: >-
          O Kalulu distingue o acesso <b>do adulto</b> do acesso
          <b>do estudante</b>. {^adult} entra com um e-mail e uma senha, para
          gerenciar a conta. O estudante entra com um código de três símbolos,
          sem teclado nem senha.
        note: >-
          As configurações da conta são reservadas aos adultos. O Kalulu pede
          uma pequena verificação antes de dar acesso.

  create-account:
    title: "Criar uma conta"
    intro: >-
      A conta é criada uma única vez, em algumas telas. Depois você poderá
      alterar tudo em {ui:SETTINGS}.
    steps:
      open-signup:
        title: "Abrir a criação de conta"
        body: >-
          Na tela inicial, escolha a aba {ui:CREATE_ACCOUNT}.
      language:
        title: "Escolher o idioma"
        body: >-
          Selecione o idioma no qual os estudantes vão aprender a ler e toque em
          {ui:NEXT}.
        note: >-
          É o idioma do conteúdo pedagógico e determina as lições baixadas. Ele
          é independente do idioma da interface.
      account-type:
        title: "Indicar o tipo de conta"
        body: >-
          Escolha «{ui:TEACHER}» ou «{ui:PARENT}». Você é {you_are}: as perguntas
          seguintes dependem dessa escolha.
      method:
        title: "Escolher o método de ensino"
        body: >-
          Indique se você usa apenas o aplicativo ou se o acompanha com os
          cadernos e os jogos em papel.
      devices:
        title: "Indicar o número de dispositivos"
        body: >-
          Informe em quantos dispositivos os estudantes vão trabalhar. O Kalulu os distribuirá entre os dispositivos.
      students-count:
        title: "Indicar o número de estudantes por dispositivo"
        body: >-
          Para cada dispositivo, informe quantos estudantes vão usá-lo. O Kalulu os
          cria e atribui automaticamente um código de acesso a cada um.
        note: >-
          Nesta etapa os estudantes são criados sem nome. Você os renomeará depois
          em {ui:SETTINGS} — veja «Renomear um estudante».
      player:
        title: "Preencher os dados de cada estudante"
        body: >-
          Digite o nome e a idade de cada estudante. É aqui que você escolhe os
          identificadores que aparecerão no aplicativo.
        note: >-
          Em caso de erro, ou mais tarde se necessário, esses dados continuam
          editáveis — veja «Renomear um estudante».
      credentials:
        title: "Informar suas credenciais"
        body: >-
          Digite seu e-mail e escolha uma senha. São suas credenciais de adulto:
          servem para recuperar a conta em outro dispositivo e para acessar as
          configurações.
      conditions:
        title: "Aceitar os termos de uso"
        body: >-
          Leia os termos gerais de uso e marque a caixa para aceitá-los.
      recap:
        title: "Conferir o resumo"
        body: >-
          A última tela resume a conta: e-mail, tipo de conta, número de
          dispositivos e os estudantes com o respectivo código. Confira e confirme.
        note: >-
          É preciso tocar em «{ui:SAVE_ALL_CODES}» para que «{ui:VALIDATE}»
          fique ativo: é o único momento em que a folha de códigos é oferecida.
          Basta tocar: mesmo que você feche a janela de salvamento sem salvar
          nada, «{ui:VALIDATE}» fica clicável. Salve-a de todo modo: é com
          esses códigos que os estudantes entram. Atenção: se você voltar para
          mudar um nome ou o número de estudantes, a folha deixa de descrever a
          conta, então é preciso pedi-la de novo, e «{ui:VALIDATE}» se desativa
          até lá.
      created:
        title: "A conta foi criada"
        body: >-
          O Kalulu confirma a criação da conta.
          {ui:CODES_AVAILABLE_IN_SETTINGS}

  sign-in:
    title: "Entrar na sua conta"
    intro: >-
      O acesso do adulto serve para recuperar a conta, neste dispositivo ou em
      outro.
    steps:
      adult-sign-in:
        title: "Informar suas credenciais"
        body: >-
          Na tela inicial, fique na aba de acesso, digite seu e-mail e sua senha
          e toque em {ui:NEXT}.
        note: >-
          O botão «{ui:RESET_PASSWORD}» não está ali de início: ele só
          aparece depois de uma tentativa de acesso recusada pela senha, sob a
          mensagem «{ui:LOGIN_WRONG_PASSWORD}». Toque nele e o Kalulu envia um
          link para o endereço informado, e depois mostra
          «{ui:CHECK_YOUR_EMAIL}»; o botão fica inativo em seguida, pois só uma
          mensagem é enviada. Se a mensagem for «{ui:LOGIN_USER_NOT_FOUND}», o
          botão não aparecerá: é o endereço que precisa ser corrigido.
      pick-device:
        title: "Escolher o dispositivo"
        body: >-
          Se sua conta abrange vários dispositivos, o Kalulu pergunta em qual você está. Cada dispositivo tem os seus próprios estudantes.

  student-sign-in:
    title: "Acesso estudante"
    intro: >-
      O estudante não tem e-mail nem senha: entra com um código de três
      símbolos, que consegue reconhecer sem saber ler.
    steps:
      code-screen:
        title: "A tela de acesso"
        body: >-
          Uma vez escolhido o dispositivo, o Kalulu mostra o teclado de
          símbolos. No alto, a tela indica de qual dispositivo se trata.
      enter-code:
        title: "Digitar o código"
        body: >-
          O estudante toca nos seus três símbolos, na ordem. As caixas de cima
          vão sendo preenchidas. O jogo começa assim que o código fica completo.
      forgot-code:
        title: "Código esquecido"
        body: >-
          Os códigos dos estudantes podem ser consultados a qualquer momento em
          {ui:SETTINGS}, na linha «{ui:STUDENT_CODES}».

  how-to-play:
    title: "Como se joga"
    intro: >-
      O Kalulu se apresenta como uma viagem: doze jardins encadeados, uma lição
      depois da outra. Esta parte descreve o que o estudante vê e faz. Aqui
      não há nada para configurar.
    steps:
      gardens-chain:
        title: "Doze jardins, uma só sequência"
        body: >-
          O percurso inteiro cabe em doze jardins, ligados numa ordem fixa.
          Avança-se sempre no mesmo sentido: um jardim se abre quando o anterior
          termina, e nenhum é pulado.
      one-garden:
        title: "Dentro de um jardim"
        body: >-
          Um jardim contém algumas lições, dispostas como fichas ao longo de um
          caminho. A ficha contornada de dourado é a próxima a jogar; as
          cinzentas ainda estão fechadas. O caminho sai do jardim e segue para o
          seguinte.
        note: >-
          O jardim floresce aos poucos: as plantas e os animais aparecem à
          medida que o estudante termina as lições.
      what-is-a-lesson:
        title: "O que é uma lição"
        body: >-
          Ao tocar numa ficha, a lição se abre em roda. No centro, o filme
          «{ui:LOOKANDLEARN}»; em volta, os minijogos da lição, um por setor. O
          contorno dourado indica o que vem a seguir.
      look-and-learn:
        title: "O filme «{ui:LOOKANDLEARN}»"
        body: >-
          Cada lição começa com um filme curto que apresenta o grafema: como se
          escreve e que som faz. Pode ser repetido quantas vezes quiser.
      minigames:
        title: "Os minijogos"
        body: >-
          Depois vêm de um a três minijogos, conforme a lição. Cada um é um jogo
          de animais — águas-vivas, sapos, caranguejos, macacos, periquitos,
          pinguins, tartarugas, formigas, lagartas — e eles se abrem um após o
          outro. A lição termina quando todos são vencidos.
      boss:
        title: "Os chefes"
        body: >-
          Entre dois jardins fica um chefe: palavras para ler, sem imagem nem
          pista. É preciso vencê-lo para entrar no jardim seguinte.
      boss-blocks:
        title: "Quando o chefe resiste"
        body: >-
          Depois de duas falhas seguidas, o chefe se bloqueia e o jogo pede um
          adulto. A tela pede para repetir o chefe com o estudante e fazê-lo
          pronunciar as palavras em voz alta, e depois inserir os três símbolos
          que ela mostra para desbloquear o aplicativo.
        note: >-
          Não é um castigo, é um sinal: a leitura ainda não está firme, e é a
          hora de refazer essa etapa com o estudante.
      brain-screen:
        title: "A tela do cérebro"
        body: >-
          O cérebro mostra a viagem inteira: os doze jardins num relance, os chefes que os separam e o progresso do jogador. É ali que se vê o caminho
          percorrido e o que falta.
      final-boss:
        title: "O último chefe"
        body: >-
          No fim do último jardim espera um chefe final. Vencê-lo desbloqueia
          algo na tela do cérebro: não o descrevemos aqui, é uma surpresa para descobrir junto com o estudante.
  manage-students:
    title: "Acessar as configurações"
    intro: >-
      Tudo o que diz respeito aos estudantes — adicionar, renomear, excluir —
      acontece nas configurações, reservadas aos adultos.
    steps:
      open-settings:
        title: "Abrir as configurações"
        body: >-
          Na tela de acesso do estudante, toque em {ui:SETTINGS}.
      adult-check:
        title: "Provar que você é um adulto"
        body: >-
          O Kalulu mostra uma pequena verificação para garantir que
          um estudante não entre sozinho nas configurações. Siga a instrução
          exibida.
      student-list:
        title: "A lista dos estudantes"
        body: >-
          As configurações mostram os estudantes do dispositivo selecionado, cada
          um com o seu código. As pastilhas de cima permitem passar de um
          dispositivo para outro.

  add-student:
    title: "Adicionar um estudante"
    steps:
      add-button:
        title: "Tocar no botão de adicionar"
        body: >-
          Nas configurações, toque no ícone de adicionar destacado abaixo. Os
          botões dessa linha não têm texto: o nome aparece como dica de tela.
      confirm-add:
        title: "Confirmar"
        body: >-
          O Kalulu pede confirmação: «{ui:ADD_STUDENT_POPUP}». O estudante é
          criado com um código novo, que você poderá renomear em seguida.
      internet-needed:
        title: "É necessária uma conexão com a internet"
        body: >-
          {ui:SETTINGS_INTERNET_MANDATORY_TO_ADD_STUDENT}. É o servidor que
          garante que o código atribuído ainda não esteja em uso. Sem conexão, o
          botão de adicionar não aparece.

  rename-student:
    title: "Renomear um estudante"
    intro: >-
      O nome de um estudante pode ser alterado a qualquer momento, sem consequências
      para o progresso nem para o código.
    steps:
      pick-student:
        title: "Escolher o estudante"
        body: >-
          Na lista, toque no estudante que você quer renomear.
      edit-name:
        title: "Alterar o nome"
        body: >-
          A ficha do estudante se abre. Toque no nome para editá-lo e confirme.
      close-panel:
        title: "Fechar a ficha"
        body: >-
          Feche a janela pelo xis no canto superior direito. O novo nome aparece
          imediatamente na lista.

  delete-student:
    title: "Excluir um estudante"
    intro: >-
      A exclusão retira o estudante da conta e libera o seu código.
    steps:
      open-panel:
        title: "Abrir a ficha e tocar na lixeira"
        body: >-
          Abra a ficha do estudante e toque no ícone de lixeira.
      confirm-delete:
        title: "Confirmar a exclusão"
        body: >-
          O Kalulu pede confirmação: «{ui:DELETE_STUDENT_POPUP}»
      irreversible:
        title: "É definitivo"
        body: >-
          O progresso do estudante é perdido e não pode ser recuperado, nem
          mesmo a partir do servidor. Na dúvida, prefira renomear a ficha e
          reaproveitá-la.

  synchronise:
    title: "Sincronização e folha de códigos"
    steps:
      why:
        title: "Para que serve a sincronização"
        body: >-
          O Kalulu funciona sem conexão e envia os dados ao servidor assim que
          houver internet. A sincronização manual serve para forçar esse envio,
          por exemplo logo depois de renomear um estudante.
        note: >-
          Não é obrigatório: a atualização é enviada de qualquer forma no
          próximo acesso do estudante.
      sync-button:
        title: "Sincronizar agora"
        body: >-
          Nas configurações, toque no ícone de sincronização, cuja dica de tela
          indica «{ui:SYNCHRONIZE_ACCOUNT}».
      codes-sheet:
        title: "Recuperar os códigos"
        body: >-
          O ícone de exportação, cuja dica de tela indica
          «{ui:EXPORT_STUDENT_CODES}», salva novamente a folha de códigos a
          qualquer momento. Útil para reimprimi-la, ou depois de adicionar
          um estudante.
