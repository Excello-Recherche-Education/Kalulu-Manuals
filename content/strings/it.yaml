meta:
  title: "Manuale d'uso di Kalulu"
  subtitle_teacher: "Guida per l'insegnante — creare un account, gestire gli studenti"
  subtitle_parent: "Guida per la famiglia — creare un account, gestire i bambini"

labels:
  contents: "Indice"
  language: "Lingua"
  app_version: "Versione di Kalulu"
  generated: "Documento generato il"
  unreviewed: "BOZZA — questa traduzione non è ancora stata riletta da un madrelingua."

vocabulary:
  teacher:
    the_learners: "gli studenti"
    of_learners: "degli studenti"
    of_the_learner: "dello studente"
    learner: "studente"
    learners: "studenti"
    a_learner: "uno studente"
    the_learner: "lo studente"
    adult: "l'insegnante"
    you_are: "insegnante"
  parent:
    the_learners: "i bambini"
    of_learners: "dei bambini"
    of_the_learner: "del bambino"
    learner: "bambino"
    learners: "bambini"
    a_learner: "un bambino"
    the_learner: "il bambino"
    adult: "il genitore"
    you_are: "genitore o tutore"

sections:
  getting-started:
    title: "Per cominciare"
    intro: >-
      Kalulu insegna a leggere con il metodo della decodifica. Questo manuale
      copre tutto ciò che accade prima del gioco: creare l'account, accedere e
      gestire {the_learners}.
    steps:
      welcome:
        title: "La schermata iniziale"
        body: >-
          All'apertura dell'applicazione, Kalulu mostra la schermata iniziale. È
          il punto di partenza sia per accedere a un account esistente sia per
          crearne uno nuovo.
      two-kinds-of-login:
        title: "Due accessi da non confondere"
        body: >-
          Kalulu distingue l'accesso <b>dell'adulto</b> dall'accesso
          <b>{learner}</b>. {adult} accede con un indirizzo email e una
          password, per gestire l'account. {the_learner} accede con un codice di
          tre simboli, senza tastiera né password.
        note: >-
          Le impostazioni dell'account sono riservate agli adulti. Kalulu chiede
          una piccola verifica prima di lasciare entrare.

  create-account:
    title: "Creare un account"
    intro: >-
      L'account si crea una sola volta, in poche schermate. Potrai modificare
      tutto in seguito in {ui:SETTINGS}.
    steps:
      open-signup:
        title: "Aprire la creazione dell'account"
        body: >-
          Nella schermata iniziale, scegli la scheda {ui:CREATE_ACCOUNT}.
      language:
        title: "Scegliere la lingua"
        body: >-
          Seleziona la lingua in cui {the_learners} impareranno a leggere, poi premi
          {ui:NEXT}.
        note: >-
          È la lingua del contenuto didattico e determina le lezioni scaricate.
          È indipendente dalla lingua dell'interfaccia.
      account-type:
        title: "Indicare il tipo di account"
        body: >-
          Scegli «{ui:TEACHER}» o «{ui:PARENT}». Tu sei {you_are}: questa scelta
          decide le domande successive.
      method:
        title: "Scegliere il metodo educativo"
        body: >-
          Indica se usi soltanto l'applicazione oppure se la accompagni con i
          quaderni e i giochi su carta.
      devices:
        title: "Indicare il numero di dispositivi"
        body: >-
          Indica su quanti dispositivi lavoreranno i tuoi studenti. Kalulu
          distribuirà gli studenti dispositivo per dispositivo.
      students-count:
        title: "Indicare il numero di studenti per dispositivo"
        body: >-
          Per ogni dispositivo, indica quanti studenti lo useranno. Kalulu crea
          gli studenti e assegna automaticamente a ciascuno un codice di
          accesso.
        note: >-
          In questa fase gli studenti vengono creati senza nome. Li rinominerai
          poi in {ui:SETTINGS} — vedi «Rinominare {a_learner}».
      player:
        title: "Inserire i dati di ogni bambino"
        body: >-
          Inserisci il nome e l'età di ogni bambino. È qui che scegli gli
          identificativi che compariranno nell'applicazione.
        note: >-
          In caso di errore, o più avanti se serve, questi dati restano
          modificabili — vedi «Rinominare {a_learner}».
      credentials:
        title: "Inserire le tue credenziali"
        body: >-
          Inserisci il tuo indirizzo email e scegli una password. Sono le tue
          credenziali di adulto: servono a ritrovare l'account su un altro
          dispositivo e ad accedere alle impostazioni.
      conditions:
        title: "Accettare le condizioni generali"
        body: >-
          Leggi le condizioni generali d'uso e spunta la casella per
          accettarle.
      recap:
        title: "Controllare il riepilogo"
        body: >-
          L'ultima schermata riassume l'account: indirizzo email, tipo di
          account, numero di dispositivi e {the_learners} con il loro codice.
          Controlla, poi conferma.
        note: >-
          Il pulsante «{ui:SAVE_ALL_CODES}» salva il foglio dei codici in un
          file. Conservalo: è con quei codici che accedono {the_learners}.
      created:
        title: "L'account è creato"
        body: >-
          Kalulu conferma la creazione dell'account.
          {ui:CODES_AVAILABLE_IN_SETTINGS}

  sign-in:
    title: "Accedere al proprio account"
    intro: >-
      L'accesso dell'adulto serve a ritrovare l'account, su questo dispositivo o
      su un altro.
    steps:
      adult-sign-in:
        title: "Inserire le proprie credenziali"
        body: >-
          Nella schermata iniziale, resta sulla scheda di accesso, inserisci il
          tuo indirizzo email e la tua password, poi premi {ui:NEXT}.
        note: >-
          Password dimenticata? Usa «{ui:RESET_PASSWORD}»: Kalulu invia un link
          al tuo indirizzo email.
      pick-device:
        title: "Scegliere il dispositivo"
        body: >-
          Se il tuo account copre più dispositivi, Kalulu chiede quale sia
          questo. Ogni dispositivo ha i propri studenti.

  student-sign-in:
    title: "Accesso {learner}"
    intro: >-
      {the_learner} non ha né email né password: accede con un codice di tre
      simboli, che può riconoscere senza saper leggere.
    steps:
      code-screen:
        title: "La schermata di accesso"
        body: >-
          Una volta scelto il dispositivo, Kalulu mostra la tastiera di simboli.
          In alto la schermata indica di quale dispositivo si tratta.
      enter-code:
        title: "Inserire il codice"
        body: >-
          {the_learner} preme i suoi tre simboli, in ordine. Le caselle in alto
          si riempiono man mano. Il gioco parte appena il codice è completo.
      forgot-code:
        title: "Codice dimenticato"
        body: >-
          I codici {of_learners} si possono consultare in qualsiasi momento in
          {ui:SETTINGS}, alla riga «{ui:STUDENT_CODES}».

  manage-students:
    title: "Accedere alle impostazioni"
    intro: >-
      Tutto ciò che riguarda {the_learners} — aggiungere, rinominare, eliminare —
      avviene nelle impostazioni, riservate agli adulti.
    steps:
      open-settings:
        title: "Aprire le impostazioni"
        body: >-
          Dalla schermata di accesso {learner}, premi {ui:SETTINGS}.
      adult-check:
        title: "Dimostrare di essere un adulto"
        body: >-
          Kalulu mostra una piccola verifica per assicurarsi che {a_learner} non
          entri da solo nelle impostazioni. Segui l'istruzione mostrata.
      student-list:
        title: "L'elenco {of_learners}"
        body: >-
          Le impostazioni mostrano {the_learners} del dispositivo selezionato,
          ciascuno con il proprio codice. Le pastiglie in alto permettono di
          passare da un dispositivo all'altro.

  add-student:
    title: "Aggiungere {a_learner}"
    steps:
      add-button:
        title: "Premere il pulsante di aggiunta"
        body: >-
          Nelle impostazioni, premi il pulsante di aggiunta
          ({ui:SETTINGS_ADD_STUDENT}).
      confirm-add:
        title: "Confermare"
        body: >-
          Kalulu chiede conferma: «{ui:ADD_STUDENT_POPUP}». {the_learner} viene
          creato con un codice nuovo, che potrai rinominare subito.
      internet-needed:
        title: "Serve una connessione a internet"
        body: >-
          {ui:SETTINGS_INTERNET_MANDATORY_TO_ADD_STUDENT}. È il server a
          garantire che il codice assegnato non sia già preso. Senza
          connessione, il pulsante di aggiunta non compare.

  rename-student:
    title: "Rinominare {a_learner}"
    intro: >-
      Il nome {the_learner} può essere cambiato in qualsiasi momento, senza
      conseguenze sui suoi progressi né sul suo codice.
    steps:
      pick-student:
        title: "Scegliere {the_learner}"
        body: >-
          Nell'elenco, premi su {the_learner} che vuoi rinominare.
      edit-name:
        title: "Modificare il nome"
        body: >-
          Si apre la scheda {of_the_learner}. Premi sul nome per modificarlo, poi
          conferma.
      close-panel:
        title: "Chiudere la scheda"
        body: >-
          Chiudi la finestra con la croce in alto a destra. Il nuovo nome
          compare subito nell'elenco.

  delete-student:
    title: "Eliminare {a_learner}"
    intro: >-
      L'eliminazione toglie {the_learner} dall'account e libera il suo codice.
    steps:
      open-panel:
        title: "Aprire la scheda e premere il cestino"
        body: >-
          Apri la scheda {of_the_learner}, poi premi l'icona del cestino.
      confirm-delete:
        title: "Confermare l'eliminazione"
        body: >-
          Kalulu chiede conferma: «{ui:DELETE_STUDENT_POPUP}»
      irreversible:
        title: "È definitivo"
        body: >-
          I progressi {of_the_learner} vanno persi e non sono recuperabili, nemmeno
          dal server. Nel dubbio, rinomina piuttosto la scheda e riutilizzala.

  synchronise:
    title: "Sincronizzazione e foglio dei codici"
    steps:
      why:
        title: "A cosa serve la sincronizzazione"
        body: >-
          Kalulu funziona senza connessione e invia i dati al server appena
          internet è disponibile. La sincronizzazione manuale serve a forzare
          questo invio, per esempio subito dopo aver rinominato {a_learner}.
        note: >-
          Non è obbligatoria: l'aggiornamento parte comunque al prossimo accesso
          {of_the_learner}.
      sync-button:
        title: "Sincronizzare adesso"
        body: >-
          Nelle impostazioni, premi {ui:SYNCHRONIZE_ACCOUNT}.
      codes-sheet:
        title: "Ritrovare i codici"
        body: >-
          «{ui:EXPORT_STUDENT_CODES}» risalva il foglio dei codici in qualsiasi
          momento. Utile per ristamparlo, o dopo aver aggiunto {a_learner}.
