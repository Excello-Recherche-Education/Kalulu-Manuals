locale: it
# Translated from fr.yaml, then read through end to end against it and
# corrected: article contractions, sentence-initial capitals, noun-noun
# compounds that do not work in this language, and phrasing that read as a
# literal rendering rather than as something written in it.
#
# Still awaiting a native speaker, which is what `reviewed` claims -- so it
# stays false and the cover keeps its draft banner. Set it to true once someone
# who speaks this language has read the built PDF.
reviewed: false

meta:
  title: "Manuale d'uso di Kalulu"
  subtitle_teacher: "Guida per l'insegnante — creare un account, gestire gli studenti"
  subtitle_parent: "Guida per la famiglia — creare un account, gestire gli studenti"

labels:
  contents: "Indice"
  language: "Lingua"
  app_version: "Versione di Kalulu"
  generated: "Documento generato il"
  unreviewed: "BOZZA — questa traduzione non è ancora stata riletta da un madrelingua."

vocabulary:
  teacher:
    adult: "l'insegnante"
    you_are: "insegnante"
  parent:
    adult: "il genitore"
    you_are: "genitore o tutore"

sections:
  getting-started:
    title: "Per cominciare"
    intro: >-
      Kalulu insegna a leggere con il metodo della decodifica. Questo manuale
      copre tutto ciò che accade prima del gioco: creare l'account, accedere e
      gestire gli studenti.
    steps:
      welcome:
        title: "La schermata iniziale"
        body: >-
          All'apertura dell'applicazione, Kalulu mostra la schermata iniziale. È
          il punto di partenza sia per accedere a un account esistente sia per
          crearne uno nuovo.
      two-kinds-of-login:
        title: "Due accessi da non confondere"
        body: >-
          Kalulu distingue l'accesso <b>dell'adulto</b> dall'accesso
          <b>dello studente</b>. {^adult} accede con un indirizzo email e una
          password, per gestire l'account. Lo studente accede con un codice di
          tre simboli, senza tastiera né password.
        note: >-
          Le impostazioni dell'account sono riservate agli adulti. Kalulu chiede
          una piccola verifica prima di consentire l'accesso.

  create-account:
    title: "Creare un account"
    intro: >-
      L'account si crea una sola volta, in poche schermate. Potrai modificare
      tutto in seguito in {ui:SETTINGS}.
    steps:
      open-signup:
        title: "Aprire la creazione dell'account"
        body: >-
          Nella schermata iniziale, scegli la scheda {ui:CREATE_ACCOUNT}.
      language:
        title: "Scegliere la lingua"
        body: >-
          Seleziona la lingua in cui gli studenti impareranno a leggere, poi premi
          {ui:NEXT}.
        note: >-
          È la lingua del contenuto didattico e determina le lezioni scaricate.
          È indipendente dalla lingua dell'interfaccia.
      account-type:
        title: "Indicare il tipo di account"
        body: >-
          Scegli «{ui:TEACHER}» o «{ui:PARENT}». Sei {you_are}: da questa scelta
          dipendono le domande successive.
      method:
        title: "Scegliere il metodo educativo"
        body: >-
          Indica se usi soltanto l'applicazione oppure se la accompagni con i
          quaderni e i giochi su carta.
      devices:
        title: "Indicare il numero di dispositivi"
        body: >-
          Indica su quanti dispositivi lavoreranno gli studenti. Kalulu li distribuirà tra i dispositivi.
      students-count:
        title: "Indicare il numero di studenti per dispositivo"
        body: >-
          Per ogni dispositivo, indica quanti studenti lo useranno. Kalulu li crea
          e assegna automaticamente a ciascuno un codice di accesso.
        note: >-
          In questa fase gli studenti vengono creati senza nome. Li rinominerai
          poi in {ui:SETTINGS} — vedi «Rinominare uno studente».
      player:
        title: "Inserire i dati di ogni studente"
        body: >-
          Inserisci il nome e l'età di ogni studente. È qui che scegli gli
          identificativi che compariranno nell'applicazione.
        note: >-
          In caso di errore, o più avanti se serve, questi dati restano
          modificabili — vedi «Rinominare uno studente».
      credentials:
        title: "Inserire le tue credenziali"
        body: >-
          Inserisci il tuo indirizzo email e scegli una password. Sono le tue
          credenziali di adulto: servono a ritrovare l'account su un altro
          dispositivo e ad accedere alle impostazioni.
      conditions:
        title: "Accettare le condizioni generali"
        body: >-
          Leggi le condizioni generali d'uso e spunta la casella per
          accettarle.
      recap:
        title: "Controllare il riepilogo"
        body: >-
          L'ultima schermata riassume l'account: indirizzo email, tipo di
          account, numero di dispositivi e gli studenti con il loro codice.
          Controlla, poi conferma.
        note: >-
          Il pulsante «{ui:SAVE_ALL_CODES}» salva il foglio dei codici in un
          file. Conservalo: è con quei codici che accedono gli studenti.
      created:
        title: "L'account è stato creato"
        body: >-
          Kalulu conferma la creazione dell'account.
          {ui:CODES_AVAILABLE_IN_SETTINGS}

  sign-in:
    title: "Accedere al proprio account"
    intro: >-
      L'accesso dell'adulto serve a ritrovare l'account, su questo dispositivo o
      su un altro.
    steps:
      adult-sign-in:
        title: "Inserire le proprie credenziali"
        body: >-
          Nella schermata iniziale, resta sulla scheda di accesso, inserisci il
          tuo indirizzo email e la tua password, poi premi {ui:NEXT}.
        note: >-
          Password dimenticata? Usa «{ui:RESET_PASSWORD}»: Kalulu invia un link
          al tuo indirizzo email.
      pick-device:
        title: "Scegliere il dispositivo"
        body: >-
          Se il tuo account copre più dispositivi, Kalulu chiede su quale ti trovi. Ogni dispositivo ha i propri studenti.

  student-sign-in:
    title: "Accesso dello studente"
    intro: >-
      Lo studente non ha né email né password: accede con un codice di tre
      simboli, che può riconoscere senza saper leggere.
    steps:
      code-screen:
        title: "La schermata di accesso"
        body: >-
          Una volta scelto il dispositivo, Kalulu mostra la tastiera di simboli.
          In alto la schermata indica di quale dispositivo si tratta.
      enter-code:
        title: "Inserire il codice"
        body: >-
          Lo studente preme i suoi tre simboli, in ordine. Le caselle in alto
          si riempiono man mano. Il gioco parte appena il codice è completo.
      forgot-code:
        title: "Codice dimenticato"
        body: >-
          I codici degli studenti si possono consultare in qualsiasi momento in
          {ui:SETTINGS}, alla riga «{ui:STUDENT_CODES}».

  how-to-play:
    title: "Come si gioca"
    intro: >-
      Kalulu si presenta come un viaggio: dodici giardini uno dietro l'altro,
      una lezione dopo l'altra. Questa parte descrive ciò che lo studente vede
      e fa. Qui non c'è nulla da impostare.
    steps:
      gardens-chain:
        title: "Dodici giardini, una sola catena"
        body: >-
          L'intero percorso sta in dodici giardini, collegati in un ordine
          fisso. Si avanza sempre nello stesso senso: un giardino si apre quando
          il precedente è finito, e non se ne salta nessuno.
      one-garden:
        title: "Dentro un giardino"
        body: >-
          Un giardino contiene alcune lezioni, disposte come pastiglie lungo un
          sentiero. La pastiglia cerchiata d'oro è la prossima da giocare;
          quelle grigie sono ancora chiuse. Il sentiero esce dal giardino e
          prosegue verso il successivo.
        note: >-
          Il giardino fiorisce a poco a poco: piante e animali compaiono man
          mano che lo studente completa le lezioni.
      what-is-a-lesson:
        title: "Che cos'è una lezione"
        body: >-
          Premendo una pastiglia, la lezione si apre a ruota. Al centro il
          filmato «{ui:LOOKANDLEARN}»; tutt'intorno i minigiochi della lezione,
          uno per spicchio. Il bordo dorato indica che cosa viene dopo.
      look-and-learn:
        title: "Il filmato «{ui:LOOKANDLEARN}»"
        body: >-
          Ogni lezione comincia con un breve filmato che presenta il grafema:
          come si scrive e che suono fa. Si può rivedere quante volte si vuole.
      minigames:
        title: "I minigiochi"
        body: >-
          Seguono da uno a tre minigiochi, secondo la lezione. Ognuno è un gioco
          di animali — meduse, rane, granchi, scimmie, parrocchetti, pinguini,
          tartarughe, formiche, bruchi — e si aprono uno dopo l'altro. La
          lezione è finita quando sono tutti superati.
      boss:
        title: "I boss"
        body: >-
          Fra due giardini c'è un boss: parole da leggere, senza immagine né
          indizio. Bisogna superarlo per entrare nel giardino successivo.
      boss-blocks:
        title: "Quando il boss resiste"
        body: >-
          Dopo due tentativi falliti di seguito, il boss si blocca e il gioco
          chiede un adulto. La schermata chiede di rifare il boss con
          lo studente facendogli pronunciare le parole a voce alta, e poi di
          inserire i tre simboli che mostra per sbloccare l'applicazione.
        note: >-
          Non è una punizione, è un segnale: la lettura non è ancora sicura, ed
          è il momento di rifare quel passaggio con lo studente.
      brain-screen:
        title: "La schermata del cervello"
        body: >-
          Il cervello mostra l'intero viaggio: i dodici giardini a colpo
          d'occhio, i boss che li separano e i progressi del giocatore. Lì si vede
          la strada percorsa e quella che resta.
      final-boss:
        title: "L'ultimo boss"
        body: >-
          In fondo all'ultimo giardino aspetta un boss finale. Batterlo sblocca
          qualcosa nella schermata del cervello: non lo descriviamo qui, è una
          sorpresa da scoprire con lo studente.
  manage-students:
    title: "Accedere alle impostazioni"
    intro: >-
      Tutto ciò che riguarda gli studenti — aggiungere, rinominare, eliminare —
      avviene nelle impostazioni, riservate agli adulti.
    steps:
      open-settings:
        title: "Aprire le impostazioni"
        body: >-
          Dalla schermata di accesso dello studente, premi {ui:SETTINGS}.
      adult-check:
        title: "Dimostrare di essere un adulto"
        body: >-
          Kalulu mostra una piccola verifica per assicurarsi che uno studente non
          entri da solo nelle impostazioni. Segui l'istruzione mostrata.
      student-list:
        title: "L'elenco degli studenti"
        body: >-
          Le impostazioni mostrano gli studenti del dispositivo selezionato,
          ciascuno con il proprio codice. Le pastiglie in alto permettono di
          passare da un dispositivo all'altro.

  add-student:
    title: "Aggiungere uno studente"
    steps:
      add-button:
        title: "Premere il pulsante di aggiunta"
        body: >-
          Nelle impostazioni, premi l'icona di aggiunta cerchiata qui sotto. I
          pulsanti di questa fila non hanno un'etichetta scritta: il nome
          compare come suggerimento.
      confirm-add:
        title: "Confermare"
        body: >-
          Kalulu chiede conferma: «{ui:ADD_STUDENT_POPUP}». Lo studente viene
          creato con un codice nuovo, che potrai rinominare subito.
      internet-needed:
        title: "Serve una connessione a internet"
        body: >-
          {ui:SETTINGS_INTERNET_MANDATORY_TO_ADD_STUDENT}. È il server a
          garantire che il codice assegnato non sia già preso. Senza
          connessione, il pulsante di aggiunta non compare.

  rename-student:
    title: "Rinominare uno studente"
    intro: >-
      Il nome dello studente può essere cambiato in qualsiasi momento, senza
      conseguenze sui suoi progressi né sul suo codice.
    steps:
      pick-student:
        title: "Scegliere lo studente"
        body: >-
          Nell'elenco, premi sullo studente che vuoi rinominare.
      edit-name:
        title: "Modificare il nome"
        body: >-
          Si apre la scheda dello studente. Premi sul nome per modificarlo, poi
          conferma.
      close-panel:
        title: "Chiudere la scheda"
        body: >-
          Chiudi la finestra con la croce in alto a destra. Il nuovo nome
          compare subito nell'elenco.

  delete-student:
    title: "Eliminare uno studente"
    intro: >-
      L'eliminazione toglie lo studente dall'account e libera il suo codice.
    steps:
      open-panel:
        title: "Aprire la scheda e premere il cestino"
        body: >-
          Apri la scheda dello studente, poi premi l'icona del cestino.
      confirm-delete:
        title: "Confermare l'eliminazione"
        body: >-
          Kalulu chiede conferma: «{ui:DELETE_STUDENT_POPUP}»
      irreversible:
        title: "È definitivo"
        body: >-
          I progressi dello studente vanno persi e non sono recuperabili, nemmeno
          dal server. Nel dubbio, rinomina piuttosto la scheda e riutilizzala.

  synchronise:
    title: "Sincronizzazione e foglio dei codici"
    steps:
      why:
        title: "A cosa serve la sincronizzazione"
        body: >-
          Kalulu funziona senza connessione e invia i dati al server appena
          internet è disponibile. La sincronizzazione manuale serve a forzare
          questo invio, per esempio subito dopo aver rinominato uno studente.
        note: >-
          Non è obbligatoria: l'aggiornamento parte comunque al prossimo accesso
          dello studente.
      sync-button:
        title: "Sincronizzare adesso"
        body: >-
          Nelle impostazioni, premi l'icona di sincronizzazione, il cui
          suggerimento indica «{ui:SYNCHRONIZE_ACCOUNT}».
      codes-sheet:
        title: "Ritrovare i codici"
        body: >-
          L'icona di esportazione, il cui suggerimento indica
          «{ui:EXPORT_STUDENT_CODES}», risalva il foglio dei codici in qualsiasi
          momento. Utile per ristamparlo, o dopo aver aggiunto uno studente.
