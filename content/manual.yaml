# Structure of the Kalulu user manual. Language-neutral on purpose: the prose
# for each id lives in content/strings/<locale>.yaml, so re-ordering a flow does
# not touch four translations and fixing a sentence cannot move an arrow.
#
# `audiences` on a section or a step restricts it: the app really does differ
# for a parent and a teacher -- a parent names each child during registration,
# a teacher only says how many students a device has and renames them
# afterwards.
#
# It does NOT split the output. One language makes ONE manual, and a restricted
# step is marked on the page instead: a chip above its title, plus a callout
# wherever the flow forks saying which numbered steps each reader follows and
# where everyone rejoins. Both are generated from this file, so re-ordering a
# flow cannot leave the callout naming the wrong steps.
#
# There used to be one manual per audience, which meant a reader had to decide
# whether they were "more a teacher or a parent" before they had read a word of
# either -- for four steps of difference out of thirty-four. Whoever hands out
# the link now has one file per language and nothing to explain.

version: 1
# The **released** version this manual describes, which is deliberately behind
# the one under development: development is internal, the manual goes outside.
# So this is bumped at release, never to follow project.godot -- reading it
# from the frontend would put an unreleased internal version on the cover of a
# document handed to teachers. `kalulu-manual check` prints both so the gap
# stays visible on purpose rather than by neglect.
app_version: "3.1.5"

# The languages Kalulu's interface is translated into, which is what a manual
# about using that interface has to follow. See README, "Languages".
locales: [fr, es, pt_BR, it]
# The order the audiences are listed in on the page: chips are tinted in this
# order, and a fork callout names them in it.
audiences: [teacher, parent]

sections:
  - id: getting-started
    steps:
      # First, and with no screenshot: it is about the document rather than
      # the app. One manual serves teachers and parents, so it has to say so
      # before the reader meets the first chip and wonders what it means.
      - id: who-this-is-for
      - id: welcome
        shot: welcome
      - id: two-kinds-of-login

  - id: create-account
    steps:
      - id: open-signup
        shot: welcome
        annotations:
          - {type: ellipse, node: "%Toggle"}
      - id: language
        shot: register-language
      - id: account-type
        shot: register-account-type
      - id: method
        shot: register-method
        audiences: [teacher]
      - id: devices
        shot: register-devices
        audiences: [teacher]
      - id: students-count
        shot: register-students-count
        audiences: [teacher]
      - id: player
        shot: register-player
        audiences: [parent]
      - id: credentials
        shot: register-credentials
      - id: conditions
        shot: register-conditions
      - id: recap
        shot: register-recap
        annotations:
          # The two buttons the note is about: the one that must be pressed,
          # and the one that stays dead until it has been. %SaveAllCodesButton
          # is unique; Confirm is reached by path because the scene never
          # marked it, and the capture records both.
          # Rounded rectangles, not ellipses: an ellipse inscribed in a wide
          # button clips its corners and cuts through the label.
          - {type: rect, node: "%SaveAllCodesButton"}
          - {type: rect, node: "Steps/RecapStep/RightMargin/RightContainer/ValidateButton"}
      - id: created
        shot: account-created

  - id: sign-in
    steps:
      - id: adult-sign-in
        shot: welcome
      - id: pick-device
        shot: device-selection
        audiences: [teacher]

  - id: student-sign-in
    steps:
      - id: code-screen
        shot: student-login
      - id: enter-code
        shot: student-login
        annotations:
          - {type: rect, node: "%Slots"}
      - id: forgot-code

  # Placed before the account chores: an adult who has just installed Kalulu
  # wants to know what the child is about to do, not how to rename them.
  - id: how-to-play
    steps:
      # No screenshot on purpose: the brain map is the whole journey at once
      # and reading it before you have seen a single garden is disorienting.
      # It gets its own step further down.
      - id: gardens-chain
      - id: one-garden
        shot: garden
      - id: what-is-a-lesson
        shot: lesson-wheel
      - id: look-and-learn
        shot: look-and-learn
      - id: minigames
        shot: lesson-wheel-progress
      - id: boss
        shot: boss
      - id: boss-blocks
      - id: brain-screen
        shot: brain
      - id: final-boss

  - id: manage-students
    steps:
      - id: open-settings
        shot: student-login
        annotations:
          - {type: ellipse, node: "Footer/TeacherButton"}
          - {type: arrow, node: "Footer/TeacherButton"}
      - id: adult-check
        shot: adult-gate
      - id: student-list
        shot: settings
        annotations:
          - {type: rect, node: "%StudentsContainer"}

  - id: add-student
    steps:
      - id: add-button
        shot: settings
        annotations:
          - {type: ellipse, node: "%AddStudentButton"}
      - id: confirm-add
        shot: settings-add-student
      - id: internet-needed

  - id: rename-student
    steps:
      - id: pick-student
        shot: settings
        annotations:
          # The whole first student card, not %Panel1 -- that is one of the
          # three code symbols inside it, and the name repeats per card.
          - {type: rect, node: "Page/Card/CardMargin/CardContent/StudentsScroll/StudentsContainer/StudentPanel"}
          - {type: arrow, node: "Page/Card/CardMargin/CardContent/StudentsScroll/StudentsContainer/StudentPanel"}
      - id: edit-name
        shot: student-details
        annotations:
          - {type: rect, node: "%NameLineEdit"}
          - {type: arrow, node: "%NameLineEdit"}
      - id: close-panel
        shot: student-details
        annotations:
          - {type: ellipse, node: "%CloseButton"}

  - id: delete-student
    steps:
      - id: open-panel
        shot: student-details
        annotations:
          - {type: ellipse, node: "%DeleteButton"}
      - id: confirm-delete
        shot: settings-delete-student
      - id: irreversible

  - id: synchronise
    steps:
      - id: why
      - id: sync-button
        shot: settings
        annotations:
          # NOT %MenuButton -- that is the overflow menu (language, sign out,
          # delete account). Synchronise is the first icon of the Actions row.
          - {type: ellipse, node: "Page/ControlsRow/Actions/SynchronizeButton"}
      - id: codes-sheet
        shot: settings
        annotations:
          - {type: ellipse, node: "Page/Card/CardMargin/CardContent/CardActions/ExportCodesButton"}
